name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install -g expo-cli
      - run: echo "NODE_ENV=production" > .env
      - run: npx expo prebuild --platform android --clean
        env:
          NODE_ENV: production
      - run: unzip predzakaz-androidide.zip -d extracted && cp -r extracted/predzakaz/. .
      - run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7me: Build Android APK

on:
  push:
      branches: [main, master]
        workflow_dispatch:

        jobs:
          build:
              runs-on: ubuntu-latest

                  steps:
                                uses: actions/checkout@v4

                                      - name: Setup Node.js
                                              uses: actions/setup-node@v4
                                                      with:
                                                                node-version: '20'
                                                                          cache: 'npm'

                                                                                - name: Install dependencies
                                                                                        run: npm install

                                                                                              - name: Setup Java
                                                                                                      uses: actions/setup-java@v4
                                                                                                              with:
                                                                                                                        distribution: 'temurin'
                                                                                                                                  java-version: '17'

                                                                                                                                        - name: Setup Android SDK
                                                                                                                                                uses: android-actions/setup-android@v3

                                                                                                                                                      - name: Install Expo CLI
                                                                                                                                                              run: npm install -g expo-cli

                                                                                                                                                                    - name: Create .env file
                                                                                                                                                                            run: echo "NODE_ENV=production" > .env

                                                                                                                                                                                  - name: Prebuild Android
                                                                                                                                                                                          run: npx expo prebuild --platform android --clean
                                                                                                                                                                                                  env:
                                                                                                                                                                                                            NODE_ENV: production

                                                                                                                                                                                                                  - name: Unzip project
                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                    unzip predzakaz-androidide.zip -d extracted
                                                                                                                                                                                                                                              cp -r extracted/predzakaz/. .

                                                                                                                                                                                                                                                    - name: Build Debug APK
                                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                                      cd andr
